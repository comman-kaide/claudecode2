services:
  - type: web
    name: secretary-ai
    env: python
    runtime: python
    pythonVersion: "3.11"
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: SLACK_BOT_TOKEN
        sync: false
      - key: SLACK_SIGNING_SECRET
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      - key: GOOGLE_TOKEN_JSON
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: TIMEZONE
        value: Asia/Tokyo
      - key: DEFAULT_SLACK_CHANNEL
        value: "#general"
      - key: DAILY_REPORT_TIME
        value: "18:00"
